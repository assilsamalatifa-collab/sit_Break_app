name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
        working-directory: sit_break_app

      - name: Fix Kotlin Version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
        working-directory: sit_break_app

      - name: Get dependencies
        run: flutter pub get
        working-directory: sit_break_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: sit_break_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sit-break-app-apk
          path: sit_break_app/build/app/outputs/flutter-apk/app-release.apk
