name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android folder if not exists
        run: |
          cd sit_break_app
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Force Update Kotlin Version in settings.gradle
        run: |
          cd sit_break_app/android
          if [ -f "settings.gradle" ]; then
            sed -i 's/version ".*"/version "1.9.24"/g' settings.gradle
          fi

      - name: Get dependencies
        run: flutter pub get
        working-directory: sit_break_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: sit_break_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sit-break-app-apk
          path: sit_break_app/build/app/outputs/flutter-apk/app-release.apk
