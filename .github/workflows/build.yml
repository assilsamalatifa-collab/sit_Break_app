name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: sit_break_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sit-break-app-apk
          path: sit_break_app/build/app/outputs/flutter-apk/app-release.apk
